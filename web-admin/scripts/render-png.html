<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      body {
        margin: 0;
        padding: 0;
        background: white;
      }
      svg {
        display: block;
        max-width: 100%;
        height: auto;
      }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  </head>
  <body>
    <div id="svg-container"></div>

    <script>
      // Load SVG
      fetch("../public/flow-card-incident.svg")
        .then((r) => r.text())
        .then((svg) => {
          document.getElementById("svg-container").innerHTML = svg;

          // Auto render to PNG after 1 second
          setTimeout(() => {
            html2canvas(document.getElementById("svg-container"), {
              scale: 2,
              backgroundColor: "#ffffff",
              useCORS: true,
              allowTaint: true,
            }).then((canvas) => {
              // Create download link
              const link = document.createElement("a");
              link.href = canvas.toDataURL("image/png");
              link.download = "flow-card-incident.png";

              // Log to console
              console.log("✅ PNG rendered!");
              console.log(
                "📊 Dimensions: " + canvas.width + "x" + canvas.height,
              );
              console.log(
                "💾 Size: " + (link.href.length / 1024).toFixed(0) + " KB",
              );

              // Trigger download
              document.body.appendChild(link);
              link.click();
              document.body.removeChild(link);

              // Show message
              document.body.innerHTML =
                "<h1>✅ PNG Generated!</h1><p>Check your downloads folder.</p>";
            });
          }, 1000);
        })
        .catch((err) => {
          console.error("Error:", err);
          document.body.innerHTML =
            "<h1>❌ Error</h1><p>" + err.message + "</p>";
        });
    </script>
  </body>
</html>
